<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TEST — Formulaire simplifié NutriWell</title>
<style>
:root{--rc:#DB6350;--rbp:#faf0ef;--cr:#FFF9F7;--td:#2D2326;--tm:#5C4A50;--tl:#8A7278}
*{box-sizing:border-box}
body{margin:0;padding:40px 16px;background:var(--cr);font-family:'Open Sans',system-ui,sans-serif;color:var(--td)}
.form-wrap{max-width:480px;margin:0 auto}
.bloc{background:#fff;border:1px solid #f1e3e1;border-radius:16px;padding:28px}
.bloc-title{font-size:1.1rem;font-weight:600;margin:0 0 4px}
.bloc-sub{font-size:.85rem;color:var(--tl);margin:0 0 20px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.fg input{width:100%;padding:11px 14px;border:1px solid #e8d9d6;border-radius:10px;font-size:.95rem}
.req{color:var(--rc)}
.btn-submit{width:100%;padding:14px;border:0;border-radius:50px;background:var(--rc);color:#fff;font-size:1rem;font-weight:500;cursor:pointer}
.note{font-size:.8rem;color:var(--tl);text-align:center;margin-top:14px}
#prog{display:none}
</style>
</head>
<body>
<div id="prog"></div>
<div class="form-wrap">
<form id="nwForm" method="POST">
<input type="hidden" name="oid" value="">
<input type="hidden" name="cid" value="">
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">

<div class="bloc">
<p class="bloc-title">TEST · Formulaire simplifié</p>
<p class="bloc-sub">Deux champs seulement — le nom est fixé à « TEST » pour que le dossier Drive soit reconnaissable.</p>
<div class="fg"><label>Prénom <span class="req">*</span></label><input type="text" name="prenom" required></div>
<div class="fg"><label>Email <span class="req">*</span></label><input type="email" name="email" required></div>
<div class="fg" style="display:none"><label>Nom</label><input type="text" name="nom" value="TEST"></div>
<button type="submit" class="btn-submit" id="submitBtn">Envoyer le test ✨</button>
<p class="note">Ajoute <code>?oid=…</code> à l'URL pour tester le rattachement GHL.</p>
</div>

</form>
</div>
<script>
/* =========================================================
   CONFIGURATION — seules lignes à adapter
   ========================================================= */
const NW_CONFIG = {
  N8N_WEBHOOK_URL: 'https://webhook.n8n.nutriwellcoaching.fr/webhook/nutriwell-bienvenue-7f3a9c',
  SUCCESS_PAGE: 'https://inscription.nutriwellcoaching.fr/merci.html',
  FORM_VERSION: '2026-09',
  TURNSTILE_SITE_KEY: ''                              // optionnel : clé de site Cloudflare Turnstile (anti-bot)
};

/* ---------- barre de progression (inchangé) ---------- */
window.addEventListener('scroll',()=>{const p=document.getElementById('prog');const h=document.documentElement;const pct=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100;p.style.width=pct+'%'});

/* ---------- pré-remplissage depuis l'URL ----------
   Tout paramètre dont le nom correspond à un champ du formulaire est injecté :
   ?oid=xxx&cid=yyy            -> champs cachés GoHighLevel (recommandé)
   ?prenom=Marie&email=...     -> champs visibles (possible, mais évite le PII dans les URLs)
   Radios : ?photos=oui   Select : ?jour_bilan=Lundi   Case unique : ?guide_lu=1 */
(function prefillFromUrl(){
  const form=document.getElementById('nwForm');
  const params=new URLSearchParams(location.search);
  const blocked=new Set(['_subject','_gotcha']);
  params.forEach((value,key)=>{
    if(blocked.has(key))return;
    const field=form.elements.namedItem(key)||form.elements.namedItem(key+'[]');
    if(!field)return;
    if(typeof RadioNodeList!=='undefined'&&field instanceof RadioNodeList){
      [...field].forEach(el=>{ if(el.type==='checkbox'){ el.checked=value.split(',').includes(el.value); } });
      if(field.value!==undefined&&[...field][0].type==='radio')field.value=value;
      return;
    }
    if(field.type==='checkbox'){field.checked=['1','true','oui','on'].includes(value.toLowerCase());return;}
    field.value=value;
  });
})();

/* ---------- Turnstile (optionnel) ---------- */
if(NW_CONFIG.TURNSTILE_SITE_KEY){
  const holder=document.createElement('div');holder.id='nw-turnstile';holder.style.cssText='display:flex;justify-content:center;margin:0 auto 16px';
  document.getElementById('submitBtn').before(holder);
  window.nwTurnstileReady=()=>turnstile.render('#nw-turnstile',{sitekey:NW_CONFIG.TURNSTILE_SITE_KEY,language:'fr'});
  const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?onload=nwTurnstileReady';s.async=true;s.defer=true;document.head.appendChild(s);
}

/* ---------- construction du payload structuré ----------
   Parcourt chaque bloc (.bloc) et chaque question (.fg) pour produire :
   - answers  : { nom_du_champ: valeur }              (tableau pour les cases à cocher)
   - sections : [{ title, fields:[{ name, label, type, value, display }] }]  (libellés lisibles) */
function buildPayload(form){
  const answers={};const sections=[];
  form.querySelectorAll('.bloc').forEach(bloc=>{
    const title=(bloc.querySelector('.bloc-title')?.textContent||'').trim();
    const fields=[];
    bloc.querySelectorAll('.fg').forEach(fg=>{
      const controls=[...fg.querySelectorAll('input,select,textarea')].filter(c=>c.name&&!['hidden','submit','button'].includes(c.type));
      if(!controls.length)return;
      const first=controls[0];
      const name=first.name.replace(/\[\]$/,'');
      const label=(fg.querySelector(':scope > label')?.textContent||'').replace(/\*\s*$/,'').trim();
      const optionText=c=>(c.parentElement?.textContent||c.value).trim();
      let type,value,display;
      if(first.type==='checkbox'){
        const checked=controls.filter(c=>c.checked);
        if(controls.length===1&&!first.name.endsWith('[]')){type='checkbox';value=first.checked?first.value:'';display=first.checked?optionText(first):'';}
        else{type='checkbox_multi';value=checked.map(c=>c.value);display=checked.map(optionText);}
      }else if(first.type==='radio'){
        type='radio';const c=controls.find(c=>c.checked);value=c?c.value:'';display=c?optionText(c):'';
      }else if(first.tagName==='SELECT'){
        type='select';value=first.value;display=first.value?first.selectedOptions[0].textContent.trim():'';
      }else{
        type=first.type||first.tagName.toLowerCase();value=first.value.trim();display=value;
      }
      answers[name]=value;
      fields.push({name,label,type,value,display});
    });
    if(fields.length)sections.push({title,fields});
  });
  return {answers,sections};
}

/* ---------- envoi vers n8n ---------- */
document.getElementById('nwForm').addEventListener('submit',async function(e){
  e.preventDefault();
  const form=this,btn=document.getElementById('submitBtn');
  const setBusy=(busy,text)=>{btn.disabled=busy;btn.style.opacity=busy?'0.7':'1';btn.textContent=text;};
  setBusy(true,'Envoi en cours...');
  const fd=new FormData(form);
  const {answers,sections}=buildPayload(form);
  const payload={
    meta:{
      submission_id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),
      submitted_at:new Date().toISOString(),
      form_version:NW_CONFIG.FORM_VERSION,
      page_url:location.origin+location.pathname,
      opportunity_id:fd.get('oid')||'',
      contact_id:fd.get('cid')||'',
      honeypot:fd.get('_gotcha')||'',
      turnstile_token:(NW_CONFIG.TURNSTILE_SITE_KEY&&window.turnstile)?turnstile.getResponse():''
    },
    answers,
    sections
  };
  try{
    const r=await fetch(NW_CONFIG.N8N_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.ok){window.location.href=NW_CONFIG.SUCCESS_PAGE;return;}
    console.error('n8n a répondu',r.status);
  }catch(err){console.error('Envoi impossible',err);}
  setBusy(false,'Erreur — réessaie');
});
</script>
</body>
</html>
